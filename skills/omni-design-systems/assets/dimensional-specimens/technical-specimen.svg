<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description"><title id="title">Two useful views, one source of values</title><desc id="description">Original static storyboard of front and relief inspection views for synthetic A6 B10 C4. B remains selected. Controls are proposed intent only.</desc><rect width="1000" height="650" fill="#eaf0eb"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" fill="#253633" font-weight="700" text-anchor="start">ORIGINAL STATIC SKETCH / SYNTHETIC DATA / SOURCE ONLY</text><text x="40" y="79" font-size="31" fill="#253633" font-weight="700" text-anchor="start">Two useful views, one source of values</text><text x="40" y="113" font-size="17" fill="#253633" font-weight="400" text-anchor="start">Inspect selected evidence without losing exact comparison · synthetic units</text><text x="40" y="142" font-size="14" fill="#253633" font-weight="400" text-anchor="start">Technical specimen: static front/inspection storyboard; no working camera or controls.</text><text x="65" y="184" font-size="15" fill="#253633" font-weight="700" text-anchor="start">1  DEFAULT ANALYTICAL VIEW</text><text x="535" y="184" font-size="15" fill="#253633" font-weight="700" text-anchor="start">2  SELECTED INSPECTION VIEW</text><line x1="70" y1="386" x2="420" y2="386" stroke="#80908b" stroke-width="2"/><rect x="105" y="290" width="52" height="96" fill="#a7b8b0" stroke="#405d53"/><text x="131" y="265" font-size="17" fill="#253633" font-weight="700" text-anchor="middle">A · 6</text><text x="131" y="420" font-size="15" fill="#253633" font-weight="400" text-anchor="middle">A</text><rect x="205" y="226" width="52" height="160" fill="#2b706a" stroke="#405d53"/><text x="231" y="201" font-size="17" fill="#253633" font-weight="700" text-anchor="middle">B · 10</text><text x="231" y="420" font-size="15" fill="#253633" font-weight="400" text-anchor="middle">B</text><rect x="305" y="322" width="52" height="64" fill="#a7b8b0" stroke="#405d53"/><text x="331" y="297" font-size="17" fill="#253633" font-weight="700" text-anchor="middle">C · 4</text><text x="331" y="420" font-size="15" fill="#253633" font-weight="400" text-anchor="middle">C</text><line x1="540" y1="386" x2="890" y2="386" stroke="#80908b" stroke-width="2"/><polygon points="627,290 645,272 645,368 627,386" fill="#657d75" stroke="none"/><polygon points="575,290 593,272 645,272 627,290" fill="#c2cec5" stroke="none"/><rect x="575" y="290" width="52" height="96" fill="#a7b8b0" stroke="#405d53"/><text x="601" y="265" font-size="17" fill="#253633" font-weight="700" text-anchor="middle">A · 6</text><text x="601" y="420" font-size="15" fill="#253633" font-weight="400" text-anchor="middle">A</text><polygon points="727,226 745,208 745,368 727,386" fill="#657d75" stroke="none"/><polygon points="675,226 693,208 745,208 727,226" fill="#c2cec5" stroke="none"/><rect x="675" y="226" width="52" height="160" fill="#2b706a" stroke="#405d53"/><text x="701" y="201" font-size="17" fill="#253633" font-weight="700" text-anchor="middle">B · 10</text><text x="701" y="420" font-size="15" fill="#253633" font-weight="400" text-anchor="middle">B</text><polygon points="827,322 845,304 845,368 827,386" fill="#657d75" stroke="none"/><polygon points="775,322 793,304 845,304 827,322" fill="#c2cec5" stroke="none"/><rect x="775" y="322" width="52" height="64" fill="#a7b8b0" stroke="#405d53"/><text x="801" y="297" font-size="17" fill="#253633" font-weight="700" text-anchor="middle">C · 4</text><text x="801" y="420" font-size="15" fill="#253633" font-weight="400" text-anchor="middle">C</text><text x="40" y="466" font-size="16" fill="#253633" font-weight="700" text-anchor="start">Selected B = 10 units. Same identity and values in both views; height = value × 16.</text><text x="40" y="498" font-size="14" fill="#253633" font-weight="400" text-anchor="start">Control intent: Front view → Inspect selected → Reset front. Preserve selection on refresh.</text><text x="40" y="530" font-size="15" fill="#253633" font-weight="400" text-anchor="start">Exact fallback: A 6 · B 10 · C 4. Keyboard/list selection must reach the same evidence.</text><text x="40" y="563" font-size="14" fill="#253633" font-weight="400" text-anchor="start">Side faces are illustrative constant relief; no measured third axis or free rotation is implied.</text><text x="40" y="624" font-size="13" fill="#253633" font-weight="400" text-anchor="start">No runtime, rendered-quality, native interaction or user-acceptance claim.</text></g></svg>
