<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description"><title id="title">A trend with an honest gap</title><desc id="description">Original synthetic monthly observations20,25,missing,18,30. Segments stop across missing March. Constant ribbon thickness is decoration, not uncertainty.</desc><rect width="1000" height="650" fill="#101f30"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" fill="#e1eaf1" font-weight="700" text-anchor="start">ORIGINAL STATIC SKETCH / SYNTHETIC DATA / SOURCE ONLY</text><text x="40" y="79" font-size="31" fill="#e1eaf1" font-weight="700" text-anchor="start">A trend with an honest gap</text><text x="40" y="113" font-size="17" fill="#c5d5e3" font-weight="400" text-anchor="start">Monthly observations · synthetic units · no interpolation through the missing month</text><text x="40" y="140" font-size="14" fill="#c5d5e3" font-weight="400" text-anchor="start">Signal trace: a luminous front edge, quiet depth, visible discontinuity.</text><line x1="95" y1="430" x2="920" y2="430" stroke="#324b62" stroke-width="1"/><text x="77" y="435" font-size="13" fill="#b9cbdc" font-weight="400" text-anchor="end">0</text><line x1="95" y1="370" x2="920" y2="370" stroke="#324b62" stroke-width="1"/><text x="77" y="375" font-size="13" fill="#b9cbdc" font-weight="400" text-anchor="end">10</text><line x1="95" y1="310" x2="920" y2="310" stroke="#324b62" stroke-width="1"/><text x="77" y="315" font-size="13" fill="#b9cbdc" font-weight="400" text-anchor="end">20</text><line x1="95" y1="250" x2="920" y2="250" stroke="#324b62" stroke-width="1"/><text x="77" y="255" font-size="13" fill="#b9cbdc" font-weight="400" text-anchor="end">30</text><line x1="95" y1="190" x2="920" y2="190" stroke="#324b62" stroke-width="1"/><text x="77" y="195" font-size="13" fill="#b9cbdc" font-weight="400" text-anchor="end">40</text><polygon points="130,310 310,280 317,273 137,303" fill="#274c67" stroke="none"/><line x1="130" y1="310" x2="310" y2="280" stroke="#80d4e8" stroke-width="4"/><polygon points="670,322 850,250 857,243 677,315" fill="#274c67" stroke="none"/><line x1="670" y1="322" x2="850" y2="250" stroke="#80d4e8" stroke-width="4"/><text x="130" y="466" font-size="16" fill="#e1eaf1" font-weight="400" text-anchor="middle">Jan</text><circle cx="130" cy="310" r="5" fill="#e6bc7d"/><text x="130" y="291" font-size="18" fill="#f3f6fa" font-weight="700" text-anchor="middle">20</text><text x="310" y="466" font-size="16" fill="#e1eaf1" font-weight="400" text-anchor="middle">Feb</text><circle cx="310" cy="280" r="5" fill="#e6bc7d"/><text x="310" y="261" font-size="18" fill="#f3f6fa" font-weight="700" text-anchor="middle">25</text><text x="490" y="466" font-size="16" fill="#e1eaf1" font-weight="400" text-anchor="middle">Mar</text><line x1="490" y1="208" x2="490" y2="430" stroke="#7e8d9d" stroke-width="1" stroke-dasharray="5 6"/><text x="490" y="270" font-size="14" fill="#e4c296" font-weight="400" text-anchor="middle">No observation</text><text x="670" y="466" font-size="16" fill="#e1eaf1" font-weight="400" text-anchor="middle">Apr</text><circle cx="670" cy="322" r="5" fill="#e6bc7d"/><text x="670" y="303" font-size="18" fill="#f3f6fa" font-weight="700" text-anchor="middle">18</text><text x="850" y="466" font-size="16" fill="#e1eaf1" font-weight="400" text-anchor="middle">May</text><circle cx="850" cy="250" r="5" fill="#e6bc7d"/><text x="850" y="231" font-size="18" fill="#f3f6fa" font-weight="700" text-anchor="middle">30</text><text x="40" y="520" font-size="17" fill="#e1eaf1" font-weight="700" text-anchor="start">Exact values: Jan 20 · Feb 25 · Mar unknown · Apr 18 · May 30</text><text x="40" y="552" font-size="14" fill="#c5d5e3" font-weight="400" text-anchor="start">Front edge uses y = 430 − 6 × value. Ribbon depth is constant, not confidence.</text><text x="40" y="580" font-size="14" fill="#c5d5e3" font-weight="400" text-anchor="start">Control intent: inspect an observation; static month/value list is the equivalent route.</text><text x="40" y="624" font-size="13" fill="#e1eaf1" font-weight="400" text-anchor="start">No runtime, rendered-quality, native interaction or user-acceptance claim.</text></g></svg>
