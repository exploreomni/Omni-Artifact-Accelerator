4" y="307" font-size="15" fill="#253633" font-weight="400" text-anchor="middle">Unknown</text><text x="40" y="540" font-size="16" fill="#253633" font-weight="700" text-anchor="start">Exact values: Aster −8 · Birch 0 · Cedar +12 · Elm +12 · Fir unknown</text><text x="40" y="570" font-size="14" fill="#253633" font-weight="400" text-anchor="start">Constant width 48 and relief 8 are decorative; front-face height = |value| × 12.</text><text x="40" y="596" font-size="14" fill="#253633" font-weight="400" text-anchor="start">Control intent: select a category and inspect evidence; static exact list remains available.</text><text x="40" y="624" font-size="13" fill="#253633" font-weight="400" text-anchor="start">No runtime, rendered-quality, native interaction or user-acceptance claim.</text></g></svg>
