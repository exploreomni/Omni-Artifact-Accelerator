<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description"><title id="title">Signed evidence, sculpted restraint</title><desc id="description">Original synthetic signed bars: minus8,zero,12,12,unknown. Constant relief is decorative. No interactive behavior is implemented.</desc><rect width="1000" height="650" fill="#f1eee5"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="36" font-size="13" fill="#253633" font-weight="700" text-anchor="start">ORIGINAL STATIC SKETCH / SYNTHETIC DATA / SOURCE ONLY</text><text x="40" y="79" font-size="31" fill="#253633" font-weight="700" text-anchor="start">Signed evidence, sculpted restraint</text><text x="40" y="113" font-size="17" fill="#253633" font-weight="400" text-anchor="start">Signed contribution · synthetic units · one shared zero baseline</text><text x="40" y="140" font-size="14" fill="#253633" font-weight="400" text-anchor="start">Mineral ledger: warm field, restrained relief, precise front edges.</text><line x1="90" y1="470" x2="920" y2="470" stroke="#d3d8d0" stroke-width="1"/><text x="73" y="475" font-size="13" fill="#253633" font-weight="400" text-anchor="end">-10</text><line x1="90" y1="350" x2="920" y2="350" stroke="#627870" stroke-width="2"/><text x="73" y="355" font-size="13" fill="#253633" font-weight="400" text-anchor="end">0</text><line x1="90" y1="290" x2="920" y2="290" stroke="#d3d8d0" stroke-width="1"/><text x="73" y="295" font-size="13" fill="#253633" font-weight="400" text-anchor="end">5</text><line x1="90" y1="230" x2="920" y2="230" stroke="#d3d8d0" stroke-width="1"/><text x="73" y="235" font-size="13" fill="#253633" font-weight="400" text-anchor="end">10</text><line x1="90" y1="170" x2="920" y2="170" stroke="#d3d8d0" stroke-width="1"/><text x="73" y="175" font-size="13" fill="#253633" font-weight="400" text-anchor="end">15</text><text x="184" y="492" font-size="17" fill="#253633" font-weight="400" text-anchor="middle"