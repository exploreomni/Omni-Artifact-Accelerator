name: Review source package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # No checkout/setup action or package manager. Do not execute repository
      # code in this job. A dependency-backed job needs a qualified human gate.
      - name: Record selected source revision
        env:
          REVIEW_SHA: ${{ github.sha }}
        run: |
          printf 'Source revision selected for manual review: %s\n' "$REVIEW_SHA"
          printf '%s\n' 'No packages installed/imported; no code tests or runtime qualification performed.'
